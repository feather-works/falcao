[workspace]
resolver = "2"
members = [
    "crates/falcao-sintaxe",
    "crates/falcao-bytecode",
    "crates/falcao-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
license = "MIT"
repository = "https://github.com/feather-works/falcao"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"
